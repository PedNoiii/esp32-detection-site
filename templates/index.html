<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .status {
            font-size: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            color: #fff;
        }
        .detected {
            background-color: #4CAF50; /* Green */
        }
        .undetected {
            background-color: #FF5722; /* Orange */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Detection Status</h1>
        <div id="status-text" class="status undetected">Product Undetected!</div>
    </div>

    <script>
        // Simulate real-time data updates (replace this with live server data in a real-world setup)
        function updateStatus(status) {
            const statusText = document.getElementById('status-text');
            statusText.textContent = status;

            if (status === 'Product Detected') {
                statusText.classList.remove('undetected');
                statusText.classList.add('detected');
            } else {
                statusText.classList.remove('detected');
                statusText.classList.add('undetected');
            }
        }

        // Example: Automatically switch status every 5 seconds (for demo purposes)
        setInterval(() => {
            const currentStatus = document.getElementById('status-text').textContent;
            const newStatus = currentStatus === 'Product Detected' ? 'Product Undetected!' : 'Product Detected';
            updateStatus(newStatus);
        }, 5000);
    </script>
</body>
</html>
